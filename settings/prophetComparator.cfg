# #Haggle4-Cam-Imote.csv
# #Haggle3-Infocom5.txt 
# #RealityConnectionTraceFinal.txt

[ Message creation parameters ]
# This work as message generator for internal events (second scenario)
Events1.class = MessageEventGenerator
#Events2.interval = 58, 62 
Events1.interval = 580, 620 
#97, 103
# 25,30 (~120 texts/hour) 
#290, 310 (~12 texts/hour)
# 580, 620 (~ 6 texts/hour)
Events1.size = 10k
## range of message source/destination address 
Events1.hosts = 0, 40
# 0, 35 Haggle Cam
# 0,40 Haggle
# 0,96 Reality
Events1.prefix = M

[ ProphetRouter Settings ]
ProphetRouter.beta = 0.25
ProphetRouter.gamma = 0.1
ProphetRouter.secondsInTimeUnit = 30

# World's size for Movement Models without implicit size (width, height; meters)
MovementModel.worldSize = 100, 100
# # seed for movement models' pseudo random number generator (default = 0)
# MovementModel.rngSeed = [2; 8372; 98092; 18293; 777]
MovementModel.rngSeed = 2


#ReportsInformations
Report.nrofReports = 1

Report.reportDir = reports/prophetComparison
#Report.reportDir = reports/RealRANK

