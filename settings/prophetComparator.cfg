Scenario.name = [Prophet-GRTR@Max ; Prophet-GRTR@Min]

# If connection are false, its using external events to create messages, otherwise, it will use internal events to create messages
Scenario.simulateConnections = true
Scenario.updateInterval = 10
# 43200s == 12h
Scenario.endTime = 274883
#987529 Haggle 4 Cam
#274883 Haggle 3
#16981816 Reality

Report.warmup = 0
Scenario.nrofHostGroups = 1

[ Interfaces informations ]
btInterface.type = SimpleBroadcastInterface
btInterface.transmitSpeed = 250k
btInterface.transmitRange = 10
btInterface.scanInterval = 120

[ Group settings ]
# Use stationary movement for the external scenario, and random waypoint for the internal scenario
Group.movementModel = RandomWaypoint
Group.router = [ProphetRouter ; ProphetGRTRMinRouter]               # by default, uses ProphetRouter for this setting
Group.bufferSize = 20M
Group.waitTime = 0, 120
Group.msgTtl = 1440
Group.nrofInterfaces = 1
Group.interface1 = btInterface

[ Group1 Information ]
Group1.groupID = A
Group1.waitTime = 10, 30 
Group1.speed = 0.8, 1.4
Group1.nrofHosts = 41
#36 Haggle Cam
#41 Haggle
#97 Reality
Group1.nodeLocation = 10, 10
Group1.movementModel = [StationaryMovement ; RandomWaypoint]


Events.nrof = 1
# [ Trace information ]
# # Events1 only work for ExternalEventsQueue (first scenario)
# Events1.class = ExternalEventsQueue
# Events1.filePath = data/events/Haggle3.txt
