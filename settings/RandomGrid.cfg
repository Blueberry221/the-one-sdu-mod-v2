# GUI.UnderlayImage.offset = 0, 0
# GUI.UnderlayImage.rotate = 0.0
# GUI.UnderlayImage.scale = 2.0
# GUI.UnderlayImage.rotate = 0.0
GUI.EventLogPanel.nrofEvents = 100

GUI.UnderlayImage.fileName = data/spatial/auto_grid.png
GUI.UnderlayImage.offset = 0, 0
GUI.UnderlayImage.scale = 1.0
GUI.UnderlayImage.rotate = 0.0