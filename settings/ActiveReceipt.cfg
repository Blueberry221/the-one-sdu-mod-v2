#===========================================================================
# SCENARIO CONFIGURATION
#===========================================================================
# Menggunakan format pemisah array titik koma (;) sesuai standar parser sistem
Scenario.name = [PurePrefix_Setting ; HashSet_Setting ; Normal_Setting]
Scenario.simulateConnections = true
Scenario.updateInterval = 0.1
# 43200s == 12h
Scenario.endTime = 43200

#===========================================================================
# INTERFACE SPECIFIC SETTINGS
#===========================================================================
btInterface.type = SimpleBroadcastInterface
btInterface.transmitSpeed = 250k
btInterface.transmitRange = 10

highspeedInterface.type = SimpleBroadcastInterface
highspeedInterface.transmitSpeed = 10M
highspeedInterface.transmitRange = 1000

Scenario.nrofHostGroups = 6

#===========================================================================
# GROUP SPECIFIC SETTINGS (COMMON TO ALL GROUPS)
#===========================================================================
Group.movementModel = RandomWaypoint
# Menyatukan tiga varian router untuk dijalankan secara paralel/bergantian
Group.router = [ActiveReceiptEpidemicRouter ; ActiveReceiptV2EpidemicRouter ; EpidemicRouter]
# Mengikuti pengaturan memori longgar (50MB) agar delivery probability maksimal
Group.bufferSize = 50M
Group.waitTime = 0, 120

Group.nrofInterfaces = 1                    
Group.interface1 = btInterface              
Group.speed = 0.5, 1.5                      
Group.msgTtl = 300                          
Group.nrofHosts = 40

#===========================================================================
# INDIVIDUAL GROUP CONFIGURATIONS
#===========================================================================
[ Group 1 (pedestrian) ]
Group1.groupID = p

[ Group 2 (cars) ]
Group2.groupID = c
Group2.speed = 2.7, 13.9                    

[ Group 3 (other) ]
Group3.groupID = w

[ Group 4 (trams 1) ]
Group4.groupID = t
Group4.bufferSize = 50M
Group4.waitTime = 10, 30
Group4.speed = 7, 10
Group4.nrofHosts = 2
Group4.nrofInterfaces = 2
Group4.interface1 = btInterface
Group4.interface2 = highspeedInterface

[ Group 5 (trams 2) ]
Group5.groupID = t
Group5.bufferSize = 50M
Group5.waitTime = 10, 30
Group5.speed = 7, 10
Group5.nrofHosts = 2

[ Group 6 (trams 3) ]
Group6.groupID = t
Group6.bufferSize = 50M
# Diselaraskan menggunakan RandomWaypoint agar konsisten dengan varian tram lainnya
Group6.movementModel = RandomWaypoint
Group6.routeFile = data/spatial/tram10.wkt
Group6.routeType = 2
Group6.waitTime = 10, 30
Group6.speed = 7, 10
Group6.nrofHosts = 2

#===========================================================================
# EVENTS SETTINGS
#===========================================================================
Events.nrof = 1

[ Events 1: MessageEventGenerator specific ]
Events1.class = MessageEventGenerator
Events1.interval = 25,35
# Mengikuti ukuran payload lebih kecil (200k-500k) untuk menghindari congestion dini
Events1.size = 200k,500k
# Rentang distribusi host dibatasi dari 0 sampai 125 (total 126 node riil)
Events1.hosts = 0,125
Events1.prefix = M

#===========================================================================
# MOVEMENT SETTINGS
#===========================================================================
MovementModel.rngSeed = 0
MovementModel.worldSize = 4500, 3400
MovementModel.warmup = 1000

[ Map based movement/movement model specific settings ]
MapBasedMovement.nrofMapFiles = 4
MapBasedMovement.mapFile1 = data/spatial/roads.wkt
MapBasedMovement.mapFile2 = data/spatial/main_roads.wkt
MapBasedMovement.mapFile3 = data/spatial/pedestrian_paths.wkt
MapBasedMovement.mapFile4 = data/spatial/shops.wkt

#===========================================================================
# REPORT SETTINGS
#===========================================================================
Report.nrofReports = 2
Report.warmup = 0
Report.reportDir = reports/PurePrefixVsHashSetVsNormal(noACK)new

# Mengaktifkan kedua laporan secara bersamaan untuk memfilter visualisasi data obat
Report.report1 = MessageStatsReport
Report.report2 = FilteredMessageStatsReport

#===========================================================================
# ROUTER SETTINGS
#===========================================================================
# Sinkronisasi pembacaan parameter waktu hidup pesan tanda terima untuk tipe V2
ActiveReceiptV2EpidemicRouter.ack_ttl = 300

[ Optimization settings ]
Optimization.cellSizeMult = 5
Optimization.randomizeUpdateOrder = true

#===========================================================================
# GUI SETTINGS
#===========================================================================
GUI.UnderlayImage.fileName = data/spatial/helsinki_underlay.png
GUI.UnderlayImage.offset = 64, 20
GUI.UnderlayImage.scale = 4.75
GUI.UnderlayImage.rotate = -0.015
GUI.EventLogPanel.nrofEvents = 100